services:
  postgres:
    image: postgres:16
    container_name: carrinho-postgres
    environment:
      POSTGRES_DB: carrinho
      POSTGRES_USER: carrinho
      POSTGRES_PASSWORD: carrinho
    ports:
      - "5433:5432"
    volumes:
      - carrinho-dados:/var/lib/postgresql/data

  app1:
    build: .
    container_name: carrinho-app1
    environment: &app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/carrinho
    ports:
      - "8081:8080"
    depends_on: [postgres]
    restart: on-failure

  app2:
    build: .
    container_name: carrinho-app2
    environment: *app-env
    ports:
      - "8082:8080"
    depends_on: [postgres]
    restart: on-failure
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: carrinho-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alertas.yml:/etc/prometheus/alertas.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  carrinho-dados: